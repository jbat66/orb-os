name: Build weekday font test firmware

on:
  push:
    branches: ['fix/english-weekday-font']
    paths:
      - '.github/workflows/weekday-test-firmware.yml'
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'themes/techtobi/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: weekday-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install build tools
        run: python -m pip install platformio esptool==4.8.1 Pillow==12.3.0
      - name: Validate date font
        run: python -m unittest discover -s tests -p test_date_font.py -v
      - name: Build ESP32-S3 firmware with the corrected date font
        run: pio run -e esp32-s3-amoled-175
      - name: Package test firmware and TechTobi theme
        shell: bash
        run: |
          set -euo pipefail
          B=.pio/build/esp32-s3-amoled-175
          mkdir -p dist
          python -m esptool --chip esp32s3 merge_bin -o dist/orb-weekday-font-test-full.bin \
            --flash_mode qio --flash_freq 80m --flash_size 16MB \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" dist/orb-weekday-font-test-app.bin
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('dist/theme-tagesring-techtobi.zip', 'w', ZIP_DEFLATED) as archive:
              for file in sorted(Path('themes/techtobi').rglob('*')):
                  if file.is_file():
                      archive.write(file, file.as_posix())
          PY
          printf 'Source commit: %s\nBuild: English/German weekday font fix\nBoard: Waveshare ESP32-S3-Touch-AMOLED-1.75\n' "$GITHUB_SHA" > dist/build-info.txt
          cat > dist/INSTALL.txt <<'EOF'
          WEEKDAY FONT TEST BUILD

          The corrected date font is compiled into the firmware. Updating only
          the SD-card theme will not install the font fix.

          Existing ORB running Techtobi83 firmware with the same partition layout:
          flash orb-weekday-font-test-app.bin over USB at address 0x10000.
          This updates only the application. Do not choose Erase Flash.

          Full installation: flash orb-weekday-font-test-full.bin over USB at
          address 0x0. This includes the bootloader, partition table and app.
          A full image can overwrite saved settings; use the app-only update
          above for an existing compatible installation.

          Theme: extract theme-tagesring-techtobi.zip to the root of the SD card,
          producing /themes/techtobi/. Select Tagesring in Settings > Theme.
          If this theme is already installed, it need not be replaced.

          Test English TU and TH, the Tuesday-to-Wednesday midnight transition,
          and the other weekdays. This is a test build, not hardware-validated.
          This fork uses USB updates; the app image is not an OTA instruction.
          EOF
          (cd dist && sha256sum *.bin *.zip build-info.txt INSTALL.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: orb-weekday-font-test
          path: dist/
          retention-days: 30
          if-no-files-found: error
