name: Date font regression checks

on:
  pull_request:
    paths:
      - 'src/font_sora_26.c'
      - 'src/clock_view.cpp'
      - 'tools/gen_lv_font.py'
      - 'tests/test_date_font.py'
      - '.github/workflows/date-font.yml'
  push:
    branches: ['fix/english-weekday-font']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install font generator dependency
        run: python -m pip install Pillow==12.3.0
      - name: Check date font coverage and generation
        run: python -m unittest discover -s tests -p test_date_font.py -v
      - name: Check out the pinned LVGL headers
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v8.4.0
          path: build/lvgl
      - name: Compile font against LVGL 8.4.0 headers
        run: gcc -std=c99 -Wall -Wextra -Werror -fsyntax-only -DLV_CONF_SKIP -Ibuild/lvgl src/font_sora_26.c
